// Draw: card draw sequence.
// drawn_card_handles serializes card_set drawn_set (accumulated drawn cards).
message ProcDraw {
    uint32 step = 1;
    uint32 count = 2;                // uint16 in C++
    uint32 reason_player = 3;        // uint8 in C++
    uint32 playerid = 4;             // uint8 in C++
    uint32 reason = 5;               // uint32 in C++
    uint32 reason_effect_handle = 6; // → EffectRecord; 0 = none/freed
    repeated uint32 drawn_card_handles = 7; // card_set drawn_set
}

// Damage: LP damage processing.
message ProcDamage {
    uint32 step = 1;
    uint32 reason_player = 2;        // uint8 in C++
    uint32 playerid = 3;             // uint8 in C++
    bool is_step = 4;
    bool is_reflected = 5;
    uint32 amount = 6;               // uint32 in C++
    uint32 reason = 7;               // uint32 in C++
    uint32 reason_card_handle = 8;   // → CardRecord; 0 = nullptr
    uint32 reason_effect_handle = 9; // → EffectRecord; 0 = none/freed
}

