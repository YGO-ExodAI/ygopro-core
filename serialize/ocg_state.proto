    uint32 equip_card_handle = 5;    // → CardRecord; 0 = nullptr
    uint32 target_card_handle = 6;   // → CardRecord; 0 = nullptr
}

// PayLPCost: LP cost payment (no effect pointer — just player + amount).
message ProcPayLPCost {
    uint32 step = 1;
    uint32 playerid = 2;             // uint8 in C++
