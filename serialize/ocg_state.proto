}

// RemoveCounter: counter removal from a card.
message ProcRemoveCounter {
    uint32 step = 1;
    uint32 rplayer = 2;              // uint8 in C++
    uint32 self = 3;                 // uint8 in C++
    uint32 oppo = 4;                 // uint8 in C++
    uint32 countertype = 5;          // uint16 in C++
    uint32 count = 6;                // uint16 in C++
    uint32 reason = 7;               // uint32 in C++
    uint32 pcard_handle = 8;         // → CardRecord; 0 = nullptr
