// ---------------------------------------------------------------------------
// Lua reconstruction (separable per §6.3 / Strategy A-refined per §4.6)
// ---------------------------------------------------------------------------

message LuaReconstruction {
    // For each effect registered via a Type-C closure (see scoping doc
    // §10.1), record (card_handle, effect_slot, generator_name,
    // captured_args) so the load path can re-invoke the generator with
    // the serialized args and re-register the closure on a fresh Lua VM.
    repeated ClosureRegistration closures = 1;

    // Reserved for future Lua-side state we discover during chunks 5-6
    // that doesn't fit the closure-reconstruction model. Currently empty;
    // filling it is a §11 risk-row escalation, not a default expectation.
    bytes opaque_lua_state = 99;
}

message ClosureRegistration {
    uint32 card_handle = 1;
    uint32 effect_handle = 2;

    enum Slot {
        SLOT_UNSPECIFIED = 0;
        SLOT_CONDITION = 1;
        SLOT_COST = 2;
        SLOT_TARGET = 3;
        SLOT_OPERATION = 4;
        SLOT_VALUE = 5;
    }
    Slot slot = 3;

    // Identifies the Lua function that, when re-invoked with `captured_args`,
    // produces an equivalent closure. e.g. "s.extrafil", "s.spcon".
    // Resolved against the card's Lua module at load time.
    string generator_name = 4;

    repeated CapturedArg captured_args = 5;
}

message CapturedArg {
    oneof value {
        bool b = 1;
        int64 i = 2;
        double d = 3;
        string s = 4;
        uint32 card_handle = 5;
        uint32 group_handle = 6;
        uint32 effect_handle = 7;

        // Chunk 5b Wave 2 finding: every ProjectIgnis card script begins
        // with `local s,id=GetID()`, so any top-level function defined
        // in that script captures `s` (= the engine's _G["c<code>"]
        // class table) as an upvalue. Without explicit handling the
        // table classifies as UNKNOWN and refuses save.
        // script_self_card_code = the owning card's konami code; load
        // resolves via _G["c<code>"], which exists post-card-script-load.
        uint32 script_self_card_code = 8;

        // Chunk 5c additions per phase_p1_primitive_1_plan.md §11.1.b
        // characterization: function/table upvalues account for ~23% of
        // the corpus (5c.0 finding). The 5c implementation supports
        // recursive Lua-function dump (function_def) and small-table
        // walk (table_def for first encounter; table_ref for repeat
        // sightings within the same card via per-card pointer registry).

        // Recursive Lua-function upvalue: the function's bytecode +
        // its own upvalue list (which can themselves nest). C functions
        // remain refused — they have no bytecode.
        LuaCallback function_def = 9;

        // First sighting of a captured table within the current card's
        // save scope. Carries a per-card-unique handle that subsequent
        // sightings reference via table_ref. This preserves intra-card
        // table identity across multiple closures (5c.0 found 22.5% of
        // refused cards have intra-card sharing).
        TableDef table_def = 10;

        // Reference to a previously-emitted TableDef within the same
        // card. The handle is per-card scoped: cleared between cards
        // during save/load. Cross-card sharing is NOT handled by this
        // mechanism — that would require a duel-wide registry. The
        // chunk-5c cross-card test fixture surfaces whether cross-card
        // sharing is prevalent enough in the corpus to warrant the
        // wider scope.
        uint32 table_ref = 11;

        // Chunk 5c-A (post-12.93%-measurement extension): qualified
        // name of a C function (e.g. "Card.IsLocation", "aux.AND",
        // "Group.CreateGroup"). C functions can't be lua_dump'd, so
        // they're serialized by name and resolved on load via nested
        // lua_getglobal + lua_getfield. The save side builds a
        // pointer→name map at save start by walking known engine
        // namespaces (Card, Duel, Effect, Group, aux, Auxiliary, plus
        // Lua stdlib math/string/table). Functions outside those
        // namespaces refuse cleanly with an informative reason.
        string c_function_name = 12;
    }
}

// ---------------------------------------------------------------------------
// Captured table content (chunk 5c)
// ---------------------------------------------------------------------------
//
// One TableEntry per (key, value) pair. Both key and value are CapturedArg,
// recursively. Empty tables have entries.size() == 0.
//
// Key types observed in the script corpus (post-filter): mostly number
// (dispatch tables indexed by TYPE_*/RACE_*) and string (named buckets).
// Value types: function (the dispatch pattern), number, occasionally other
// tables.
//
// Recursion depth is bounded by the dump path's max_depth check (chunk-5c
// LuaSaveContext.max_depth) — defaults to 5, sufficient for the 5c.0
// observed maximum of 8 inner-function-count and ~depth-2 typical case.

message TableEntry {
    CapturedArg key = 1;
    CapturedArg value = 2;
}

message TableDef {
    // Per-card unique handle. Subsequent sightings of the same
    // lua_topointer within the same card emit table_ref(handle) instead
    // of re-serializing entries.
    uint32 handle = 1;
    repeated TableEntry entries = 2;
}

