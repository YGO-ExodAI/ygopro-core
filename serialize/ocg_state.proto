// TossDice: dice roll.
message ProcTossDice {
    uint32 step = 1;
    uint32 playerid = 2;             // uint8 in C++
    uint32 reason_player = 3;        // uint8 in C++
    uint32 count1 = 4;               // uint8 in C++ (player 0 dice count)
    uint32 count2 = 5;               // uint8 in C++ (player 1 dice count)
    uint32 reason_effect_handle = 6; // → EffectRecord; 0 = none/freed
}
