// TossCoin: coin toss (e.g. Graceful Charity / Skull Dice variants).
message ProcTossCoin {
    uint32 step = 1;
    uint32 playerid = 2;             // uint8 in C++
    uint32 reason_player = 3;        // uint8 in C++
    uint32 count = 4;                // uint8 in C++
    uint32 reason_effect_handle = 5; // → EffectRecord; 0 = none/freed
